name: stockpile
description: "Mobile and web inventory tracker — stock levels, movements and reorder alerts."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.1

dependencies:
  drift: ^2.34.4
  drift_flutter: ^0.3.1
  file_picker: ^12.2.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  go_router: ^17.5.0
  image_picker: ^1.2.3
  intl: ^0.20.3
  mobile_scanner: ^7.4.0
  path_provider: ^2.1.6
  pdf: ^3.13.0
  provider: ^6.1.5+1
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5

dev_dependencies:
  # Used by the migration test to build a v1 database by hand.
  sqlite3: ^3.5.2
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  drift_dev: ^2.34.6
  build_runner: ^2.15.1

flutter:
  uses-material-design: true

  assets:
    - assets/branding/
    # Also declared as an asset directory, not only as a font family: the
    # receipt PDF loads these TTFs itself, since the built-in PDF faces are
    # WinAnsi-only and cannot render a naira sign.
    - assets/fonts/

  # Inter ships two optical sizes: "Text" is spaced for small UI sizes, and
  # "Display" is tightened for large headings. Using both from one family gives
  # a display/body pairing without a second typeface.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: InterDisplay
      fonts:
        - asset: assets/fonts/InterDisplay-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/InterDisplay-Bold.ttf
          weight: 700
        - asset: assets/fonts/InterDisplay-ExtraBold.ttf
          weight: 800

flutter_launcher_icons:
  image_path: assets/branding/icon.png
  android: true
  adaptive_icon_background: "#2a78d6"
  adaptive_icon_foreground: assets/branding/icon_foreground.png
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    background_color: "#f9f9f7"
    theme_color: "#2a78d6"
