# Temporary HTTP-only server block, used once to obtain the first certificate.
#
# Install as /etc/nginx/conf.d/store.chedraolympas.com.conf, get the
# certificate, then replace this file with the real
# store.chedraolympas.com.conf and reload. See docs/DEPLOYMENT.md.
#
# Why this exists: the real config references
# /etc/letsencrypt/live/store.chedraolympas.com/fullchain.pem, and nginx
# refuses to start when a referenced certificate is missing. certbot's webroot
# plugin needs a *running* nginx to answer the ACME challenge. This file is the
# way out of that circle — it needs no certificate, so nginx starts, and
# certbot can then prove the domain.

server {
    listen 80;
    listen [::]:80;
    server_name store.chedraolympas.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Nothing is served yet. The app is not proxied from here on purpose: this
    # config exists for a minute or two and should not become the thing that
    # quietly serves production over plain HTTP.
    location / {
        return 503;
    }
}
