# Host nginx for store.chedraolympas.com.
#
# Install on the deployment host as
#   /etc/nginx/conf.d/store.chedraolympas.com.conf
#
# It is a self-contained, name-based virtual host: everything for this domain
# lives in this one file, and it touches nothing else in conf.d.
#
# This is the *host's* nginx, in front of the stack — not the nginx inside the
# web container, which serves the Flutter bundle and proxies /api. This one
# terminates TLS for the domain and proxies to the app on loopback.

# ---------------------------------------------------------------------
# No default_server here, deliberately
# ---------------------------------------------------------------------
# This host is shared. Another production site — assetmanagement.oasisproducts.ng
# — already owns `default_server` on both :80 and :443. nginx allows exactly one
# per address:port, so claiming it here would fail `nginx -t` with "duplicate
# default server", and a restart (rather than a reload) on the bad config would
# refuse to start and take the *other* site down with it.
#
# Nothing is lost by leaving it alone. A request to http://102.223.37.105 does
# not match `server_name store.chedraolympas.com`, so it falls through to the
# existing default server and is answered by that other application — it never
# reaches this app. The domain name is already the only route in at this layer.
#
# The lock that actually matters for this app is the container binding to
# 127.0.0.1:8080, which closes the one path that did bypass nginx entirely.

# ---------------------------------------------------------------------
# The site
# ---------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name store.chedraolympas.com;

    # certbot renews over HTTP, so this one path stays reachable.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name store.chedraolympas.com;

    ssl_certificate     /etc/letsencrypt/live/store.chedraolympas.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/store.chedraolympas.com/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # Only sent over TLS, and only once the certificate is known good —
    # a browser that sees this will refuse plain HTTP to this name for a
    # year, which is unrecoverable if the certificate later lapses.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # The app caps logo uploads at 5 MB; the margin covers base64's inflation.
    client_max_body_size 8m;

    access_log /var/log/nginx/store.chedraolympas.com.access.log;
    error_log  /var/log/nginx/store.chedraolympas.com.error.log warn;

    location / {
        # The container listens on loopback only. Everything the app needs —
        # the static bundle and the /api proxy — is already handled inside it,
        # so this is a single pass-through rather than a second set of rules
        # to keep in step.
        proxy_pass http://127.0.0.1:8080;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Overwritten, not appended: the API believes this header, and a
        # client must not be able to forge its own address past this point.
        proxy_set_header X-Forwarded-For   $remote_addr;
        # The app builds absolute links from APP_URL, but anything that reads
        # the scheme must see https rather than the proxy's own http hop.
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
