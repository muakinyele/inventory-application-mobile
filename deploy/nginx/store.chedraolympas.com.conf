# store.chedraolympas.com — the inventory application.
#
# Modelled on ssl_monitor.conf: a name-based vhost proxying to a local port,
# with its own logs. It claims no default_server — snipe-it.conf already owns
# that on :80 and :443, and nginx permits only one per address:port. A second
# would fail `nginx -t`, and a restart on that config would take every site on
# this host down, not just this one.
#
# A request by IP therefore still lands on Snipe-IT, exactly as before. Only
# this name reaches the inventory app.

server {
    listen 80;
    listen [::]:80;
    server_name store.chedraolympas.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name store.chedraolympas.com;

    # The per-name certificate certbot issued. A wildcard for
    # *.chedraolympas.com also covers this name, but it lives under the parent
    # name — switching to it means changing these two paths.
    #
    # The failure mode is worth knowing, because it points elsewhere: nginx
    # cannot load a certificate that is not there, so `nginx -t` fails,
    # `systemctl reload` silently does nothing, and the PREVIOUS config keeps
    # serving. The domain then falls through to whichever vhost owns
    # default_server and answers with its certificate — which the browser
    # reports as ERR_CERT_COMMON_NAME_INVALID. A TLS error whose real cause is
    # a file path.
    ssl_certificate     /etc/letsencrypt/live/store.chedraolympas.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/store.chedraolympas.com/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # The app caps logo uploads at 5 MB; the margin covers base64 inflation.
    client_max_body_size 8m;

    access_log /var/log/nginx/store_access.log;
    error_log  /var/log/nginx/store_error.log warn;

    location / {
        # The container serves the Flutter bundle and proxies /api itself, so
        # this is one pass-through rather than a second set of rules to keep
        # in step.
        proxy_pass http://127.0.0.1:8080;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Overwritten, not appended: the API trusts this header, and a client
        # must not be able to forge its own address past this point.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
