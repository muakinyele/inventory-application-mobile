name: Deploy

# Publishing and deploying are deliberately separate from CI. CI proves a
# commit is sound; this ships it. Splitting them means a pull request can
# never push an image, and a deploy can never happen from an unverified tree.

on:
  push:
    branches: [main, develop]
  # Manual promotion, and the rollback path: pick an environment and a tag.
  workflow_dispatch:
    inputs:
      environment:
        description: Where to deploy
        type: choice
        options: [staging, production]
        default: staging
        required: true
      image_tag:
        description: >-
          Image tag to deploy. Leave empty for the current commit. Set it to a
          previous commit SHA to roll back.
        type: string
        required: false

concurrency:
  # One deploy per environment at a time, and never cancelled halfway: a
  # half-applied migration is worse than a queued deploy.
  group: deploy-${{ github.event.inputs.environment || github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # Lowercased below: GHCR rejects uppercase, and GitHub owners can contain it.
  IMAGE_NAMESPACE: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------
  # Publish
  # ---------------------------------------------------------------------
  publish:
    name: Build and push images
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read
      # Lets the job push to GHCR with the run's own token — no long-lived
      # registry credential has to exist as a secret at all.
      packages: write

    outputs:
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - uses: actions/checkout@v7

      - name: Work out the tag
        id: meta
        run: |
          # The commit SHA is the real identity of a build. `latest` and the
          # branch name are moving pointers for convenience; the SHA is what a
          # rollback names, because it can never drift.
          tag="${{ github.event.inputs.image_tag }}"
          [ -n "$tag" ] || tag="${GITHUB_SHA::12}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "namespace=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.namespace }}/api:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.namespace }}/api:${{ github.ref_name }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.namespace }}/web:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.namespace }}/web:${{ github.ref_name }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # ---------------------------------------------------------------------
  # Deploy
  # ---------------------------------------------------------------------
  deploy:
    name: Deploy to ${{ github.event.inputs.environment || (github.ref_name == 'main' && 'production' || 'staging') }}
    runs-on: ubuntu-latest
    needs: publish
    timeout-minutes: 20

    # Gates on the repository's environment rules, so production can require a
    # human approval before this job starts.
    environment:
      name: ${{ github.event.inputs.environment || (github.ref_name == 'main' && 'production' || 'staging') }}
      url: ${{ vars.APP_URL }}

    steps:
      - uses: actions/checkout@v7

      - name: Check the deployment is fully configured
        id: guard
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          TOKEN_PEPPER: ${{ secrets.TOKEN_PEPPER }}
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          APP_URL: ${{ secrets.APP_URL || vars.APP_URL }}
        run: |
          # APP_URL, EMAIL_PORT and EMAIL_FROM are read as either a secret or
          # a variable. Nothing about them is sensitive, so the documentation
          # suggests variables — but a repository that has them as secrets is
          # configured correctly, and should not be told a value is missing
          # when it is plainly there.
          #
          # Three outcomes, not two.
          #
          # Nothing configured at all -> skip cleanly. A repository without a
          # host should not have a permanently red pipeline; the images are
          # published and can be rolled out by hand.
          #
          # Everything configured -> deploy.
          #
          # *Partially* configured -> fail here, naming exactly what is
          # missing. This is the case that used to slip through: the guard
          # only checked DEPLOY_HOST, so a run with a host but no
          # POSTGRES_PASSWORD went ahead and wrote an .env with empty values
          # onto the server. Compose would then refuse to start — the
          # production file guards those with `:?` — leaving the host in a
          # worse state than before the deploy, for a failure that was
          # knowable before a single byte was copied.
          if [ -z "$DEPLOY_HOST" ]; then
            echo "::notice::No DEPLOY_HOST configured; skipping remote deploy. Images were published and can be rolled out manually."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          missing=""
          for name in DEPLOY_USER DEPLOY_PATH DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS \
                      POSTGRES_PASSWORD TOKEN_PEPPER EMAIL_HOST; do
            [ -z "${!name}" ] && missing="$missing  - secret $name\n"
          done
          [ -z "$APP_URL" ] && missing="$missing  - variable APP_URL\n"

          if [ -n "$missing" ]; then
            printf '%b' "::error::DEPLOY_HOST is set, so this is a real deploy — but the configuration is incomplete and would put a broken .env on the host. Missing:\n$missing\nSee docs/DEPLOYMENT.md. Nothing was copied and the running release is untouched."
            exit 1
          fi

          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Set up the SSH key
        if: steps.guard.outputs.configured == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # Pinned from a secret rather than `StrictHostKeyChecking=no`, which
          # would accept whatever answers on that address — including someone
          # who has taken over the DNS record.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          port="${DEPLOY_PORT:-22}"
          echo "DEPLOY_PORT=$port" >> "$GITHUB_ENV"

          # `Host key verification failed` from scp says nothing about *why*,
          # and the two usual causes are invisible from the log: the pinned
          # key was taken for a different name than the one being connected
          # to, or the host listens on a non-standard port and the entry
          # therefore needs the [host]:port form. Both are diagnosed here,
          # where the answer can actually be printed.
          if ! grep -qE '^[^#[:space:]]' ~/.ssh/known_hosts; then
            echo "::error::DEPLOY_KNOWN_HOSTS is empty or contains only comments. Generate it with: ssh-keyscan -p $port <host>"
            exit 1
          fi

          echo "Pinned host key entries: $(grep -cE '^[^#[:space:]]' ~/.ssh/known_hosts)"
          echo "Fingerprints pinned:"
          ssh-keygen -lf ~/.ssh/known_hosts | sed 's/^/  /' || true

          # What the server actually presents, right now.
          if ! ssh-keyscan -T 10 -p "$port" "$DEPLOY_HOST" > /tmp/presented 2>/tmp/keyscan.err; then
            echo "::error::Could not reach the host on port $port to read its key. Is DEPLOY_HOST correct and the port open to GitHub's runners?"
            sed 's/^/  /' /tmp/keyscan.err
            exit 1
          fi
          if ! grep -qE '^[^#[:space:]]' /tmp/presented; then
            echo "::error::The host answered but offered no SSH host key on port $port."
            exit 1
          fi

          echo "Fingerprints the host presents:"
          ssh-keygen -lf /tmp/presented | sed 's/^/  /' || true

          # Compare on the key material itself, ignoring the name field, so a
          # mismatch caused purely by the hostname is reported as such.
          awk '{print $(NF-1), $NF}' /tmp/presented | sort -u > /tmp/presented.keys
          awk '{print $(NF-1), $NF}' ~/.ssh/known_hosts | sort -u > /tmp/pinned.keys
          if ! comm -12 /tmp/presented.keys /tmp/pinned.keys | grep -q .; then
            echo "::error::None of the pinned keys match what the host presents. Replace DEPLOY_KNOWN_HOSTS with the output of: ssh-keyscan -p $port <the exact DEPLOY_HOST value>"
            exit 1
          fi

          # The keys match, so any remaining failure is the *name* the entry
          # is filed under. ssh matches on name first, so an entry keyscanned
          # from an IP will not satisfy a connection made by hostname.
          if ! ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts >/dev/null 2>&1 \
             && ! ssh-keygen -F "[$DEPLOY_HOST]:$port" -f ~/.ssh/known_hosts >/dev/null 2>&1; then
            echo "::error::The host key material matches, but no entry is filed under the name being connected to. Regenerate with the exact DEPLOY_HOST value: ssh-keyscan -p $port <host>"
            exit 1
          fi

          echo "Host key verified against DEPLOY_KNOWN_HOSTS."

      - name: Deploy
        if: steps.guard.outputs.configured == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          IMAGE_TAG: ${{ needs.publish.outputs.tag }}
          NAMESPACE: ${{ github.repository }}
          # Every value the stack needs, from GitHub Secrets. Nothing
          # sensitive is committed, and nothing is typed on the host by hand.
          APP_URL: ${{ secrets.APP_URL || vars.APP_URL }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          TOKEN_PEPPER: ${{ secrets.TOKEN_PEPPER }}
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT || vars.EMAIL_PORT }}
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM || vars.EMAIL_FROM }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          namespace=$(echo "$NAMESPACE" | tr '[:upper:]' '[:lower:]')

          port="${DEPLOY_PORT:-22}"
          # BatchMode is the important one. Without it, an ssh whose key is
          # refused falls back to keyboard-interactive auth and *waits for a
          # password that will never be typed* — which on a runner looks like
          # a four-minute silence ending in exit 255, with no clue that
          # authentication was the problem at all. With it, a refused key
          # fails immediately and says so.
          #
          # The keepalives cover the other shape of the same symptom: a
          # connection that establishes and then stalls.
          ssh_opts="-o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4"
          ssh_cmd="ssh -i $HOME/.ssh/id_ed25519 -p $port $ssh_opts"

          # Authentication is checked on its own, first, because every later
          # failure is indistinguishable from it. The previous run reported
          # "rsync is not installed" when the truth was that ssh never got a
          # session at all — the probe suppressed stderr, so a failed login
          # and a missing package produced the same empty string.
          if ! $ssh_cmd -n "$DEPLOY_USER@$DEPLOY_HOST" true 2>/tmp/ssh_auth.err; then
            echo "::group::ssh output"
            sed 's/^/  /' /tmp/ssh_auth.err || true
            echo "::endgroup::"
            echo "::error::Could not open an SSH session as the deploy user. The host key verified, so this is authentication or the account itself: check that DEPLOY_SSH_KEY's public half is in ~<DEPLOY_USER>/.ssh/authorized_keys on the host, that the file is mode 600 and its directory 700, and that DEPLOY_USER is correct."
            exit 1
          fi
          echo "SSH authentication OK."

          # rsync has to exist on both ends. Finding it is less simple than it
          # sounds: `ssh host command` runs a *non-login, non-interactive*
          # shell, which on RHEL-family hosts often has a stripped PATH that
          # omits /usr/bin — so `command -v rsync` can report nothing on a
          # machine where rsync is plainly installed.
          #
          # So look in the usual locations directly as well, and if it is
          # found somewhere off PATH, tell rsync where with --rsync-path
          # rather than declaring it missing. That flag exists for exactly
          # this.
          remote_rsync=$(
            $ssh_cmd -n "$DEPLOY_USER@$DEPLOY_HOST" \
              'command -v rsync 2>/dev/null \
               || for p in /usr/bin/rsync /bin/rsync /usr/local/bin/rsync /opt/homebrew/bin/rsync; do
                    [ -x "$p" ] && { echo "$p"; break; }
                  done' 2>/dev/null | tr -d '\r' | tail -1
          )

          if [ -z "$remote_rsync" ]; then
            # Genuinely absent, or absent to this user. Report what the host
            # actually said, so the difference is visible rather than guessed
            # at — a package installed as root but invisible to DEPLOY_USER
            # looks identical to one that was never installed.
            echo "::group::What the host reports"
            $ssh_cmd -n "$DEPLOY_USER@$DEPLOY_HOST" \
              'echo "user:  $(id -un)"; echo "shell: $SHELL"; echo "PATH:  $PATH";
               echo "--- candidates ---";
               ls -l /usr/bin/rsync /bin/rsync /usr/local/bin/rsync 2>&1 | sed "s/^/  /";
               echo "--- package manager ---";
               (rpm -q rsync 2>/dev/null || dpkg -s rsync 2>/dev/null | head -2 || echo "not registered with rpm/dpkg")' \
              2>&1 | sed 's/^/  /' || true
            echo "::endgroup::"
            echo "::error::rsync could not be found on the deployment host as the deploy user. If it is installed, it is not on that user's PATH — the group above shows what the host reported. Install with 'sudo dnf install -y rsync' (RHEL/Rocky) or 'sudo apt-get install -y rsync' (Debian/Ubuntu)."
            exit 1
          fi

          echo "Remote rsync: $remote_rsync"

          # Assembled into a payload directory so what lands on the host is
          # exactly this and nothing else — rsync mirrors a directory, and
          # pointing it at the repository root would ship the whole tree.
          payload="$RUNNER_TEMP/payload"
          rm -rf "$payload" && mkdir -p "$payload"
          cp docker-compose.prod.yml "$payload/"
          cp scripts/deploy.sh "$payload/"
          # Set here rather than over ssh afterwards: rsync -a preserves the
          # mode, so the file arrives executable.
          chmod 755 "$payload/deploy.sh"

          # The compose file and the deploy script travel with the commit, so
          # the host always runs the version this build was tested against.
          #
          # --delete keeps the directory a mirror, so a file removed from the
          # repository stops lingering on the host. The excludes are what make
          # that safe: .env and .previous-tag are written *on the host* — one
          # by the next step, one by deploy.sh to record what to roll back to
          # — and are not in the payload, so without them --delete would erase
          # both, taking the rollback target with it.
          rsync --archive --compress --delete \
            --exclude '.env' \
            --exclude '.previous-tag' \
            --human-readable --itemize-changes \
            --rsync-path="$remote_rsync" \
            -e "$ssh_cmd" \
            "$payload/" "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

          # The environment file is written over the SSH pipe, never left in
          # the workspace or echoed — it holds the pepper and the SMTP
          # credential.
          ssh -i ~/.ssh/id_ed25519 -p "$port" $ssh_opts "$DEPLOY_USER@$DEPLOY_HOST" \
            "cat > $DEPLOY_PATH/.env && chmod 600 $DEPLOY_PATH/.env" <<ENVFILE
          APP_ENV=production
          APP_NAME=Stockpile
          APP_URL=${APP_URL}
          CORS_ORIGINS=${APP_URL}
          WEB_PORT=8080
          POSTGRES_USER=stockpile
          POSTGRES_DB=stockpile
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          TOKEN_PEPPER=${TOKEN_PEPPER}
          EMAIL_HOST=${EMAIL_HOST}
          EMAIL_PORT=${EMAIL_PORT:-587}
          EMAIL_SSL=false
          EMAIL_USERNAME=${EMAIL_USERNAME}
          EMAIL_PASSWORD=${EMAIL_PASSWORD}
          EMAIL_FROM=${EMAIL_FROM}
          IMAGE_REGISTRY=ghcr.io
          IMAGE_NAMESPACE=${namespace}
          IMAGE_TAG=${IMAGE_TAG}
          ENVFILE

          # -tt forces a pseudo-terminal, so the remote side gets a signal
          # and the channel closes when the script exits. Without it, ssh
          # waits on any descriptor the remote still holds — which is how a
          # deploy that had already failed and printed its error went on to
          # occupy the job for another nineteen minutes, until the job
          # timeout cancelled it and reported nothing useful.
          ssh -i ~/.ssh/id_ed25519 -p "$port" $ssh_opts -tt "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd $DEPLOY_PATH && \
             echo '$GHCR_TOKEN' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin && \
             ./deploy.sh"

      - name: Verify the deployment is serving
        if: steps.guard.outputs.configured == 'true'
        env:
          APP_URL: ${{ secrets.APP_URL || vars.APP_URL }}
        run: |
          # An external check, from outside the host: the containers reporting
          # healthy to themselves is not the same as the site answering.
          for attempt in $(seq 1 20); do
            if curl -fsS --max-time 10 "$APP_URL/healthz" >/dev/null; then
              echo "Serving at $APP_URL"
              exit 0
            fi
            sleep 5
          done
          echo "::error::$APP_URL did not respond after the deploy. The host keeps the previous release; roll back with the Deploy workflow and a previous image tag."
          exit 1
