# Runs unprivileged: the image's own user owns the cache and pid paths, and
# nothing here needs to bind a port below 1024 — the app listens on 8080 and
# the host maps it.
worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # THE FONTS HAD NO TYPE, SO THEY WERE NEVER COMPRESSED. nginx's own
    # mime.types maps woff and woff2 but neither ttf nor otf, so the seven
    # Inter faces and the icon font fell through to default_type — and
    # `gzip_types` matches on the type, so octet-stream was sent raw. That is
    # 2.9 MB of font on a cold visit against 1.4 MB gzipped, and the fonts
    # block the first frame: the engine fetches every face in the manifest
    # before it paints. Declaring the types here is the whole fix; the entries
    # below override the included file, which is what a later `types` block
    # does.
    types {
        font/ttf  ttf;
        font/otf  otf;
    }

    # Writable by the nginx user without needing root.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Logs go to the container's stdout/stderr so `docker logs` and any log
    # driver see them. Writing to files inside a container is how logs get
    # lost on the next deploy.
    log_format  json escape=json
      '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
      '"method":"$request_method","uri":"$request_uri",'
      '"status":$status,"bytes":$body_bytes_sent,'
      '"referrer":"$http_referer","agent":"$http_user_agent",'
      '"request_time":$request_time,"upstream_time":"$upstream_response_time"}';

    access_log /dev/stdout json;
    error_log  /dev/stderr warn;

    sendfile      on;
    tcp_nopush    on;
    server_tokens off;

    keepalive_timeout 65;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json application/wasm
        image/svg+xml font/ttf font/otf font/woff font/woff2;

    include /etc/nginx/conf.d/*.conf;
}
