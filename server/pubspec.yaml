name: stockpile_server
description: "Identity and account-management API for Stockpile — users, roles, sessions and audit."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.12.1

dependencies:
  # Argon2id, HMAC and SHA-256. Pure Dart, so the release binary has no
  # libargon2 to ship alongside it.
  cryptography: ^2.9.0
  # SHA-256 for token fingerprints; Argon2 comes from `cryptography`.
  crypto: ^3.0.6
  drift: ^2.34.4
  drift_postgres: ^1.3.1
  mailer: ^7.2.0
  meta: ^1.19.0
  postgres: ^3.5.12
  shelf: ^1.4.2
  shelf_router: ^1.1.4

dev_dependencies:
  build_runner: ^2.15.1
  drift_dev: ^2.34.6
  lints: ^6.0.0
  test: ^1.26.0
